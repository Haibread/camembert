[package]
name = "camembert-core"
description = "Core scanning and aggregation library for camembert"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1.9.2"
crossbeam-channel = "0.5.16"
crossbeam-deque = "0.8.7"
hashbrown = "0.17.1"
rustc-hash = "2.1.3"
serde_json = { workspace = true }
thiserror = "2.0.19"
tracing = { workspace = true }
zstd = { workspace = true }

# io_uring is a Linux kernel interface (io_uring(7)); not even portable
# across other Unixes, so it gets its own narrower `cfg` than `rustix`.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.13"

# openat/unlinkat/statx and friends (via `fs`) plus getrlimit/uname (via
# `system`) are POSIX/Unix-wide, not Linux-specific — keep this at
# `cfg(unix)` so `delete.rs`, which is POSIX-portable, is not stranded
# alongside the genuinely Linux-only modules.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "system"] }

# The Windows scan backend. `std` exposes neither an allocation size nor a
# link count on Windows (`MetadataExt::{file_index, number_of_links}` are
# still `#[unstable]`, rust#63010), so `sem = "blocks"` and hardlink dedup
# both need the raw API. 0.61 links through `windows-link` + `raw-dylib`:
# no import libraries, nothing for a CI runner to install.
#
# Two feature placements are counter-intuitive and cost a compile error if
# guessed: the `IO_REPARSE_TAG_*` constants live in
# `Win32_System_SystemServices`, not in `Win32_Storage_FileSystem`, and
# `Win32_Security` is needed not for any security API but because
# `OBJECT_ATTRIBUTES` has two `SECURITY_*` pointer fields.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dev-dependencies]
# `process` (setrlimit/getrlimit) is test-only: the fd-exhaustion
# integration test (tests/scan_errors.rs) lowers RLIMIT_NOFILE in a
# self-spawned child. The production build keeps only `fs` + `system`.
rustix = { version = "1.1.4", features = ["fs", "process"] }
