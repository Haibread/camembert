[workspace]
resolver = "3"
members = [
    "camembert-core",
    "camembert",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
# Floor set by the dependency graph (ratatui 0.30 and darling 0.23 both
# require 1.88), not by a policy. The `msrv` CI job builds against exactly
# this version, so raising it is a visible, deliberate change.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Haibread/camembert"

[workspace.dependencies]
camembert-core = { path = "camembert-core" }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
