[package]
name = "camembert"
description = "Disk usage analyzer that answers the real questions: what grew, what is freeable, what is cold"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "camembert-mangen"
path = "src/bin/mangen.rs"

[dependencies]
camembert-core = { workspace = true }
clap = { workspace = true }
clap_mangen = "0.3"
crossterm = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "termios"] }

[dev-dependencies]
portable-pty = "0.9.0"
serde_json = { workspace = true }
tempfile = "3.27.0"
