name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up the Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: cache compiled dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - name: install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # `cargo-deb` is on install-action's curated list; `cargo-generate-rpm`
      # is not, so that one comes through the cargo-binstall fallback.
      - name: install the packaging tools
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deb,cargo-generate-rpm
      # Builds and strips the binary, regenerates the man pages and shell
      # completions, then produces the .deb and .rpm. The tarball step below
      # reuses the very binary that went into the packages.
      - name: build the release binary and the native packages
        run: scripts/build-packages.sh --target ${{ matrix.target }}
      - name: package the release archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          name="camembert-${version}-${TARGET}"
          mkdir "$name"
          cp target/"$TARGET"/release/camembert LICENSE-MIT LICENSE-APACHE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      # Both packagers already encode the architecture in the file name
      # (`_amd64.deb` / `.x86_64.rpm`), so the two matrix legs never collide
      # once the artifacts are merged.
      - name: collect the native packages
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for package in target/"$TARGET"/debian/*.deb \
                         target/"$TARGET"/generate-rpm/*.rpm; do
            cp "$package" .
            name="$(basename "$package")"
            sha256sum "$name" > "$name.sha256"
          done
      - name: upload the release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camembert-${{ matrix.target }}
          path: |
            camembert-*.tar.gz
            camembert-*.tar.gz.sha256
            camembert*.deb
            camembert*.deb.sha256
            camembert*.rpm
            camembert*.rpm.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download the release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: extract this version's section from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          --notes-file release-notes.md --generate-notes
          artifacts/*
