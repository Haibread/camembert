name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up the Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: cache compiled dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: install pre-commit
        run: pipx install pre-commit
      - name: run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
      - name: run the test suite
        run: cargo test --workspace

  # Windows is a second target, not a second CI story: there is no local
  # Windows toolchain on any developer machine here, so this job is the
  # authoritative check that the `cfg(windows)` arms compile at all.
  #
  # `cargo check`, not `cargo test`, until the integration tests stop
  # assuming Unix at module level (symlink/hardlink/chmod fixtures in
  # top-level `use` statements fail to compile on Windows regardless of
  # which test is being run). Graduate this to `cargo test --workspace`
  # in the change that gates them.
  windows:
    runs-on: windows-2025
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up the Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: cache compiled dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: windows
      - name: check the workspace compiles for x86_64-pc-windows-msvc
        run: cargo check --workspace --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up the declared minimum Rust version
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88"
      - name: cache compiled dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: msrv
      - name: check the workspace builds on the declared MSRV
        run: cargo check --workspace --locked --all-targets
